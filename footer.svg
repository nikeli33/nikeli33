<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00eeff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00eeff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00eeff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="900" height="80" fill="url(#bg1)"/>

  <!-- Glow band -->
  <rect width="900" height="30" y="25" fill="url(#glow1)" filter="url(#blur1)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Scan lines -->
  <g opacity="0.06">
    <rect x="0" y="0" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="4" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="8" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="12" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="16" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="20" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="24" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="28" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="32" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="36" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="40" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="44" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="48" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="52" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="56" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="60" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="64" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="68" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="72" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="76" width="900" height="1" fill="#00eeff"/>
  </g>

  <!-- Moving scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#00eeff" opacity="0.12">
    <animateTransform attributeName="transform" type="translate" values="0,-2;0,82;0,-2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Borders -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00eeff" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="79" x2="900" y2="79" stroke="#00eeff" stroke-width="2" opacity="0.8"/>
  <line x1="0" y1="77" x2="900" y2="77" stroke="#ff2d55" stroke-width="1" opacity="0.5"/>

  <!-- Brackets -->
  <g stroke="#00eeff" stroke-width="1.5" fill="none" opacity="0.6">
    <polyline points="10,10 10,4 18,4"/>
    <polyline points="882,4 890,4 890,10"/>
    <polyline points="10,70 10,76 18,76"/>
    <polyline points="882,76 890,76 890,70"/>
  </g>

  <!-- Text -->
  <text x="450" y="36" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff2d55" opacity="0.7" letter-spacing="3">[ TRANSMISSION_END ]</text>
  <text x="450" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#00eeff" letter-spacing="4" opacity="0.85">NEXUSBOTS.RU // ЕСЛИ ЕСТЬ ЗАДАЧА — ПИШИ</text>
</svg>
