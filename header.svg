<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="40%" stop-color="#0a1628"/>
      <stop offset="70%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00eeff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00eeff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00eeff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2d55" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="900" height="200" fill="url(#bg1)"/>

  <!-- Animated cyan glow band -->
  <rect width="900" height="60" y="70" fill="url(#glow1)" filter="url(#blur1)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-40;0,40;0,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.4;1;0.6" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated red glow band -->
  <rect width="900" height="40" y="120" fill="url(#glow2)" filter="url(#blur1)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,30;0,-20;0,0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.3;0.8;0.4" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Scan lines -->
  <g opacity="0.07">
    <rect x="0" y="0" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="4" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="8" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="12" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="16" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="20" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="24" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="28" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="32" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="36" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="40" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="44" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="48" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="52" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="56" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="60" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="64" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="68" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="72" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="76" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="80" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="84" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="88" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="92" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="96" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="100" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="104" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="108" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="112" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="116" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="120" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="124" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="128" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="132" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="136" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="140" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="144" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="148" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="152" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="156" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="160" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="164" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="168" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="172" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="176" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="180" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="184" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="188" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="192" width="900" height="1" fill="#00eeff"/>
    <rect x="0" y="196" width="900" height="1" fill="#00eeff"/>
  </g>

  <!-- Moving scan line -->
  <rect x="0" y="0" width="900" height="3" fill="#00eeff" opacity="0.15">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,200;0,0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Circuit lines left -->
  <g stroke="#00eeff" stroke-width="0.5" fill="none" opacity="0.2">
    <line x1="20" y1="40" x2="80" y2="40"/>
    <line x1="80" y1="40" x2="80" y2="80"/>
    <line x1="80" y1="80" x2="120" y2="80"/>
    <circle cx="80" cy="40" r="2" fill="#00eeff"/>
    <circle cx="80" cy="80" r="2" fill="#00eeff"/>
    <line x1="20" y1="140" x2="60" y2="140"/>
    <line x1="60" y1="140" x2="60" y2="160"/>
    <line x1="60" y1="160" x2="100" y2="160"/>
    <circle cx="60" cy="140" r="2" fill="#00eeff"/>
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Circuit lines right -->
  <g stroke="#00eeff" stroke-width="0.5" fill="none" opacity="0.2">
    <line x1="880" y1="60" x2="820" y2="60"/>
    <line x1="820" y1="60" x2="820" y2="100"/>
    <line x1="820" y1="100" x2="780" y2="100"/>
    <circle cx="820" cy="60" r="2" fill="#00eeff"/>
    <circle cx="820" cy="100" r="2" fill="#00eeff"/>
    <line x1="880" y1="150" x2="840" y2="150"/>
    <line x1="840" y1="150" x2="840" y2="170"/>
    <circle cx="840" cy="150" r="2" fill="#00eeff"/>
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Top border line cyan -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00eeff" stroke-width="2" opacity="0.8"/>
  <!-- Bottom border line -->
  <line x1="0" y1="199" x2="900" y2="199" stroke="#00eeff" stroke-width="1" opacity="0.4"/>
  <!-- Red accent line -->
  <line x1="0" y1="2" x2="900" y2="2" stroke="#ff2d55" stroke-width="1" opacity="0.6"/>

  <!-- Corner brackets -->
  <g stroke="#00eeff" stroke-width="1.5" fill="none" opacity="0.7">
    <polyline points="10,18 10,8 20,8"/>
    <polyline points="880,8 890,8 890,18"/>
    <polyline points="10,182 10,192 20,192"/>
    <polyline points="880,192 890,192 890,182"/>
  </g>

  <!-- Tag top -->
  <text x="450" y="22" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff2d55" opacity="0.8" letter-spacing="3">[ SYSTEM_OVERRIDE_INITIATED ]</text>

  <!-- Main title -->
  <text x="450" y="105" text-anchor="middle" font-family="monospace" font-size="46" font-weight="bold" fill="#ffffff" letter-spacing="4">
    Nikolay Akulinin
    <animate attributeName="opacity" values="1;0.92;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Cyan glow duplicate for text -->
  <text x="452" y="106" text-anchor="middle" font-family="monospace" font-size="46" font-weight="bold" fill="#00eeff" opacity="0.12" letter-spacing="4" filter="url(#blur2)">Nikolay Akulinin</text>

  <!-- Subtitle -->
  <text x="450" y="148" text-anchor="middle" font-family="monospace" font-size="12" fill="#00eeff" letter-spacing="5" opacity="0.9">TELEGRAM_BOTS · AI_AGENTS · AUTOMATION</text>

  <!-- Bottom tag -->
  <text x="450" y="178" text-anchor="middle" font-family="monospace" font-size="8" fill="#00eeff" opacity="0.4" letter-spacing="2">NEXUSBOTS.RU // ACCESS_GRANTED</text>
</svg>
